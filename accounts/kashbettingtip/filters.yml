# filters.yml - allows commenting on photos, videos, carousels from blogger-followers
can_like_photos: true
can_like_videos: true
can_like_carousels: true

can_comment_photos: true
can_comment_videos: true
can_comment_carousels: true
can_comment_blogger-followers: true   # Important for your source
can_comment_blogger-following: true

can_watch_stories: true

# Optional: Skip low-quality accounts (recommended for safety)
min_followers: 50
max_followers: 10000
min_following: 50
max_following: 5000
min_posts: 0
max_posts: 10000

# Skip bots/spam
skip_business_accounts: false      # Set true if you want to avoid business profiles
skip_private_accounts: true        # Always skip private (can't interact anyway)

skip_if_private: true
skip_if_public: false
skip_business: false
skip_non_business: false
skip_following: true
skip_follower: true
skip_if_link_in_bio: false
follow_private_or_empty: true
interact_only_private: false

## Filters for enabling comments
# Action specific
comment_hashtag_likers_top: true
comment_hashtag_likers_recent: true
comment_hashtag_posts_top: true
comment_hashtag_posts_recent: true
comment_place_likers_top: true
comment_place_likers_recent: true
comment_place_posts_top: true
comment_place_posts_recent: true
comment_blogger_followers: true
comment_blogger_following: true
comment_blogger_post_likers: true
comment_blogger: true
comment_interact_usernames: true
comment_interact_from_file: true
comment_feed: false
# Content specific
comment_photos: true
comment_videos: true
comment_carousels: true

## Filters for sending PM
pm_to_private_or_empty: true

## Filters on number of post likers
min_likers: 1
max_likers: 1000